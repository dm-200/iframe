<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Appearance Demo</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        h2 { text-align: center; }

        .theme-controls,
        .booking-container {
            width: 100%;
            max-width: 520px;
            margin: 20px auto;
            box-sizing: border-box;
        }

        .theme-controls {
            padding: 20px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .theme-controls h3 { margin: 0 0 8px; }

        .description {
            margin: 0 0 20px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 18px 0;
        }

        .color-row label {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
        }

        .color-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="color"] {
            width: 44px;
            height: 38px;
            padding: 2px;
            cursor: pointer;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
        }

        .hex-value {
            width: 82px;
            padding: 9px 5px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
        }

        .transparent-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0 18px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            padding: 11px 14px;
            border: 0;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
        }

        #apply-theme {
            color: white;
            background: #1d4ed8;
        }

        #reset-theme {
            color: #1f2937;
            background: #e5e7eb;
        }

        #theme-status {
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .booking-container iframe {
            display: block;
            width: 100%;
            height: 500px;
            border: 0;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .theme-controls { padding: 15px; }

            .color-row label { font-size: 12px; }
            .hex-value { width: 76px; }
        }
    </style>
</head>

<body>
    <h2>Booking Appearance Demo</h2>

    <section class="theme-controls">
        <h3>Customize your booking page</h3>

        <p class="description">
            Change the colors below to test the booking page.
            Colors are sent directly to the embedded booking iframe.
        </p>

        <div class="color-row">
            <label for="theme-background">Outer background</label>
            <div class="color-inputs">
                <input type="color" id="theme-background" value="#ffffff">
                <input type="text" class="hex-value"
                    id="theme-background-hex" value="#FFFFFF"
                    maxlength="7" aria-label="Outer background hex color">
            </div>
        </div>

        <div class="transparent-row">
            <input type="checkbox" id="theme-transparent" checked>
            <label for="theme-transparent">
                Make outer background transparent
            </label>
        </div>

        <div class="color-row">
            <label for="theme-card">Service cards</label>
            <div class="color-inputs">
                <input type="color" id="theme-card" value="#F5F3ED">
                <input type="text" class="hex-value"
                    id="theme-card-hex" value="#F5F3ED"
                    maxlength="7" aria-label="Service card hex color">
            </div>
        </div>

        <div class="color-row">
            <label for="theme-surface">Background behind service tiles</label>
            <div class="color-inputs">
                <input type="color" id="theme-surface" value="#F1EEE5">
                <input type="text" class="hex-value"
                    id="theme-surface-hex" value="#F1EEE5"
                    maxlength="7" aria-label="Service tile background hex color">
            </div>
        </div>

        <div class="color-row">
            <label for="theme-message">Message area</label>
            <div class="color-inputs">
                <input type="color" id="theme-message" value="#FAF8F2">
                <input type="text" class="hex-value"
                    id="theme-message-hex" value="#FAF8F2"
                    maxlength="7" aria-label="Message area hex color">
            </div>
        </div>

        <div class="buttons">
            <button type="button" id="apply-theme">Apply colors</button>
            <button type="button" id="reset-theme">Reset demo colors</button>
        </div>

        <div id="theme-status" role="status" aria-live="polite">
            Loading booking page...
        </div>
    </section>

    <div class="booking-container">
        <iframe
            id="booking-frame"
            src="https://book.booklogica.com/northbound"
            title="Booking page preview"
            scrolling="no">
        </iframe>
    </div>

    <script>
        const BOOKING_ORIGIN = "https://book.booklogica.com";

        const bookingFrame = document.getElementById("booking-frame");
        const status = document.getElementById("theme-status");
        const transparentCheckbox = document.getElementById("theme-transparent");

        // Default test palette: Northbound's colors.
        // Change the iframe URL above to test another tenant.
        const DEFAULT_COLORS = {
            background: "#FFFFFF",
            card: "#F5F3ED",
            surface: "#F1EEE5",
            message: "#FAF8F2"
        };

        const fields = [
            { name: "background", label: "Outer background" },
            { name: "card", label: "Service cards" },
            { name: "surface", label: "Background behind service tiles" },
            { name: "message", label: "Message area" }
        ];

        function validHex(value) {
            return /^#[0-9a-fA-F]{6}$/.test(value);
        }

        function setColor(name, value) {
            document.getElementById(`theme-${name}`).value = value;
            document.getElementById(`theme-${name}-hex`).value =
                value.toUpperCase();
        }

        function initializeColors() {
            fields.forEach(field => {
                setColor(field.name, DEFAULT_COLORS[field.name]);
            });

            transparentCheckbox.checked = true;
        }

        function readTheme() {
            const theme = {};

            for (const field of fields) {
                if (field.name === "background" && transparentCheckbox.checked) {
                    theme.background = "transparent";
                    continue;
                }

                const value = document
                    .getElementById(`theme-${field.name}-hex`)
                    .value.trim();

                if (!validHex(value)) {
                    status.textContent =
                        `Please enter a valid hex color for ${field.label}.`;
                    return null;
                }

                theme[field.name] = value.toUpperCase();
            }

            return theme;
        }

        function sendTheme() {
            const theme = readTheme();
            if (!theme) return;

            if (!bookingFrame.contentWindow) {
                status.textContent = "The booking page is unavailable.";
                return;
            }

            bookingFrame.contentWindow.postMessage(
                {
                    type: "booking:theme",
                    theme
                },
                BOOKING_ORIGIN
            );

            status.textContent =
                "Theme sent: " +
                Object.entries(theme)
                    .map(([key, value]) => `${key}: ${value}`)
                    .join(" | ");
        }

        fields.forEach(field => {
            const picker = document.getElementById(`theme-${field.name}`);
            const hex = document.getElementById(`theme-${field.name}-hex`);

            picker.addEventListener("input", () => {
                hex.value = picker.value.toUpperCase();

                if (field.name === "background") {
                    transparentCheckbox.checked = false;
                }

                sendTheme();
            });

            hex.addEventListener("change", () => {
                const value = hex.value.trim();

                if (!validHex(value)) {
                    hex.value = picker.value.toUpperCase();
                    status.textContent =
                        "Invalid color. Example: #B8F3FF";
                    return;
                }

                setColor(field.name, value.toUpperCase());

                if (field.name === "background") {
                    transparentCheckbox.checked = false;
                }

                sendTheme();
            });
        });

        transparentCheckbox.addEventListener("change", sendTheme);

        document.getElementById("apply-theme")
            .addEventListener("click", sendTheme);

        document.getElementById("reset-theme")
            .addEventListener("click", () => {
                initializeColors();
                sendTheme();
            });

        // Preserve iframe resizing.
        window.addEventListener("message", event => {
            if (event.origin !== BOOKING_ORIGIN) return;
            if (event.source !== bookingFrame.contentWindow) return;

            if (event.data?.type === "booking:resize") {
                const height = Number(event.data.height);

                if (Number.isFinite(height) && height > 0) {
                    bookingFrame.style.height = `${height}px`;
                }
            }
        });

        // Send the current theme whenever the iframe loads.
        bookingFrame.addEventListener("load", sendTheme);

        initializeColors();
    </script>
</body>
</html>
