
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Iframe Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .booking-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        iframe {
            display: block;
            width: 100%;
            height: 500px;
            border: 0;
        }

        .theme-controls {
            max-width: 520px;
            margin: 20px auto;
            padding: 16px;
            background: white;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 14px 0;
            font-size: 14px;
        }

        input[type="color"] {
            width: 48px;
            height: 36px;
            cursor: pointer;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .booking-container {
                width: calc(100% + 24px);
                margin-left: -12px;
            }
        }
    </style>
</head>
<body>

    <h2>Booking Page Test</h2>

    <div class="theme-controls">
        <h3>Customize booking colors</h3>

        <div class="color-row">
            <label for="background">Main background</label>
            <input type="color" id="background" value="#142D50">
        </div>

        <div class="color-row">
            <label for="card">Service card</label>
            <input type="color" id="card" value="#F5F3ED">
        </div>

        <div class="color-row">
            <label for="surface">Background behind service tiles</label>
            <input type="color" id="surface" value="#F1EEE5">
        </div>

        <button type="button" id="reset">Reset Northbound colors</button>

        <p id="status">Change a color to preview it.</p>
    </div>

    <div class="booking-container">
        <iframe
            id="booking-frame"
            src="https://book.booklogica.com/northbound"
            title="Booking Page"
            scrolling="no">
        </iframe>
    </div>

    <script>
        const bookingFrame = document.getElementById("booking-frame");
        const status = document.getElementById("status");

        const DEFAULTS = {
            background: "#142D50",
            card: "#F5F3ED",
            surface: "#F1EEE5"
        };

        function sendTheme() {
            const theme = {
                background: document.getElementById("background").value,
                card: document.getElementById("card").value,
                surface: document.getElementById("surface").value
            };

            bookingFrame.contentWindow.postMessage(
                {
                    type: "booking:theme",
                    theme
                },
                "https://book.booklogica.com"
            );

            status.textContent = "Colors sent to this booking form.";
        }

        ["background", "card", "surface"].forEach(id => {
            document.getElementById(id).addEventListener("input", sendTheme);
        });

        document.getElementById("reset").addEventListener("click", () => {
            Object.entries(DEFAULTS).forEach(([id, color]) => {
                document.getElementById(id).value = color;
            });

            sendTheme();
        });

        window.addEventListener("message", event => {
            if (event.origin !== "https://book.booklogica.com") return;
            if (event.source !== bookingFrame.contentWindow) return;

            if (event.data?.type === "booking:resize") {
                const height = Number(event.data.height);

                if (Number.isFinite(height) && height > 0) {
                    bookingFrame.style.height = `${height}px`;
                }
            }
        });

        // Apply selected colors when the iframe finishes loading.
        bookingFrame.addEventListener("load", sendTheme);
    </script>

</body>
</html>
