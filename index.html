<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Iframe Test</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .booking-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        iframe {
            display: block;
            width: 100%;
            height: 500px; /* Initial height until first message */
            border: 0;
        }

        @media (max-width: 600px) {
            .booking-container {
                width: calc(100% + 24px);
                margin-left: -12px;
            }
        }
    </style>
</head>
<body>

    <h2>Booking Page Test</h2>

    <div class="booking-container">
        <iframe
            id="booking-frame"
            src="https://book.booklogica.com/northbound"
            title="Booking Page"
            scrolling="no">
        </iframe>
    </div>

    <script>
        const bookingFrame = document.getElementById("booking-frame");

        window.addEventListener("message", function (event) {

            // Accept messages only from the booking page
            if (event.origin !== "https://book.booklogica.com") {
                return;
            }

            // Handle booking iframe resize messages
            if (event.data?.type === "booking:resize") {
                const height = Number(event.data.height);

                if (Number.isFinite(height) && height > 0) {
                    bookingFrame.style.height = `${height}px`;
                }
            }
        });
    </script>

</body>
</html>
